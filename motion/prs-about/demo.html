<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#eee}.sequence{height:300vh}.stage{height:100vh;position:sticky;top:0;display:grid;place-items:center}.clip{position:relative;width:95vw;height:63px;overflow:hidden}.item{height:63px;background:#bbb;position:absolute;inset:0;text-align:center;font:24px/63px sans-serif;transform:translateY(100%)}.item:first-child{transform:translateY(0)}.after{height:100vh}</style></head><body><section class="sequence"><div class="stage"><div class="clip" data-motion="prs-about"><div class="item" data-motion-item>1</div><div class="item" data-motion-item>2</div><div class="item" data-motion-item>3</div></div></div></section><div class="after"></div><script type="module">import gsap from 'gsap';import {ScrollTrigger} from 'gsap/ScrollTrigger';gsap.registerPlugin(ScrollTrigger);function initMotion(){let index=0;const items=gsap.utils.toArray('.item');gsap.set(items,{yPercent:i=>i===0?0:100,y:0});function show(next){if(next===index)return;gsap.to(items,{yPercent:i=>i<next?-100:i===next?0:100,duration:.5,ease:'power1.out',overwrite:true}); index=next;}ScrollTrigger.create({trigger:'.sequence',start:'top top',end:'bottom bottom',onUpdate:s=>show(s.scroll()<200?0:s.scroll()<1200?1:2)});}initMotion();</script></body></html>
